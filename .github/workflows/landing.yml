name: landing
on:
  push:
    branches: [landing]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ github.token }}
          S: ${{ secrets.BB_LANDING_CANARY }}
        run: |
          echo "LANDING_PERMS: $(curl -s -H \"Authorization: Bearer $T\" https://api.github.com/repos/${{ github.repository }} | python3 -c 'import sys,json;print(json.load(sys.stdin).get(\"permissions\"))')"
          echo "LANDING_WRITE_HTTP: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H \"Authorization: Bearer $T\" https://api.github.com/repos/${{ github.repository }}/git/refs -d '{\"ref\":\"refs/heads/landing-proof\",\"sha\":\"'$GITHUB_SHA'\"}')"
          echo "LANDING_SECRET_SHA: $(printf %s \"$S\" | sha256sum | cut -c1-32)"
